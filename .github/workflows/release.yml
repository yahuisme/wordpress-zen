name: Release Theme

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Package and publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="$(grep -m1 '^Version:' style.css | sed 's/^Version:[[:space:]]*//')"
          if [ -z "$VERSION" ]; then
            echo "::error::无法从 style.css 读取版本号"
            exit 1
          fi
          echo "Theme version: $VERSION"

          NOTES_FILE="release-notes.md"
          awk -v version="$VERSION" '
            $0 == "## " version { found=1; next }
            found && /^## / { exit }
            found { print }
          ' .github/CHANGELOG.md | sed '/^[[:space:]]*$/d' > "$NOTES_FILE"

          if [ ! -s "$NOTES_FILE" ]; then
            echo "::error::无法从 .github/CHANGELOG.md 读取版本 $VERSION 的更新内容"
            exit 1
          fi

          {
            printf '更新内容\n\n'
            cat "$NOTES_FILE"
          } > "$NOTES_FILE.tmp"
          mv "$NOTES_FILE.tmp" "$NOTES_FILE"

          git archive --format=zip --prefix=zen/ HEAD -o zen.zip -- . ':(exclude).github' ':(exclude)AGENTS.md'

          python - "$VERSION" <<'PY'
          import sys, zipfile, re
          version = sys.argv[1]
          with zipfile.ZipFile('zen.zip') as archive:
              names = set(archive.namelist())
              required = {'zen/style.css', 'zen/functions.php', 'zen/index.php'}
              if not required.issubset(names) or 'zen/AGENTS.md' in names or any(name.startswith('zen/.github/') for name in names):
                  raise SystemExit('发布包结构校验失败')
              style = archive.read('zen/style.css').decode('utf-8')
              match = re.search(r'^Version:\s*(\S+)', style, re.MULTILINE)
              if not match or match.group(1) != version:
                  raise SystemExit('发布包版本校验失败')
          PY

          if gh release view "v$VERSION" >/dev/null 2>&1; then
            gh release upload "v$VERSION" zen.zip --clobber
            echo "Release v$VERSION 已存在，已替换 zen.zip。"
          else
            gh release create "v$VERSION" zen.zip \
              --title "Zen Theme v$VERSION" \
              --target "${{ github.sha }}" \
              --notes-file "$NOTES_FILE"
            echo "已发布 Zen Theme v$VERSION。"
          fi