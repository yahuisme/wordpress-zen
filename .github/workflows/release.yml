name: Release Packages

on:
  workflow_dispatch:
    inputs:
      release_notes:
        description: 手动发布用的中文更新说明，填写本版用户可见变化
        required: false
        default: ''
        type: string

permissions:
  contents: read

concurrency:
  group: zen-release-main
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Package release artifact
        env:
          RELEASE_NOTES: ${{ inputs.release_notes }}
        run: |
          VERSION="$(grep -m1 '^Version:' theme/zen/style.css | sed 's/^Version:[[:space:]]*//')"
          if [ -z "$VERSION" ]; then
            echo "::error::无法从 style.css 读取版本号"
            exit 1
          fi
          echo "主题版本：$VERSION"
          printf '%s\n' "${RELEASE_NOTES:-本版变更见 [更新记录](https://github.com/yahuisme/wordpress-zen/blob/${GITHUB_SHA}/CHANGELOG.md#${VERSION//./})。}" > release-notes.md

          git archive --format=zip --prefix=zen/ HEAD:theme/zen -o zen.zip

          python - "$VERSION" <<'PY'
          import sys, zipfile, re
          version = sys.argv[1]
          with zipfile.ZipFile('zen.zip') as archive:
              entries = archive.namelist()
              if len(entries) != len(set(entries)):
                  raise SystemExit('发布包包含重复文件')
              corrupt = archive.testzip()
              if corrupt:
                  raise SystemExit('发布包文件损坏：' + corrupt)
              names = {name for name in entries if not name.endswith('/')}
              forbidden = {n for n in names if n.startswith('zen/tests/') or n.startswith('zen/.github/') or n == 'zen/AGENTS.md'}
              if forbidden:
                  raise SystemExit('发布包含开发文件：' + ', '.join(sorted(forbidden)))
              expected = {
                  'zen/404.php', 'zen/LICENSE', 'zen/archive.php',
                  'zen/assets/css/github-dark.min.css', 'zen/assets/css/phosphor-icons.css', 'zen/assets/css/style.css',
                  'zen/assets/css/admin.css', 'zen/assets/css/reading.css', 'zen/assets/css/layout.css', 'zen/assets/js/admin.js',
                  'zen/assets/css/directories.css',
                  'zen/assets/fonts/Phosphor.woff2', 'zen/assets/js/highlight.min.js',
                  'zen/licenses/Phosphor-MIT.txt',
                  'zen/licenses/Highlight-BSD-3-Clause.txt', 'zen/licenses/Tailwind-MIT.txt',
                  'zen/comments.php', 'zen/comments-notes.php', 'zen/footer.php', 'zen/functions.php',
                  'zen/header.php', 'zen/inc/comments.php', 'zen/inc/enqueue.php',
                  'zen/inc/options.php', 'zen/inc/schema.php', 'zen/inc/setup.php',
                  'zen/inc/template-tags.php', 'zen/index.php', 'zen/js/main.js',
                  'zen/page-archives.php', 'zen/page-links.php', 'zen/page-tags.php', 'zen/page-notes.php', 'zen/page.php',
                  'zen/screenshot.jpg', 'zen/search.php', 'zen/single.php',
                  'zen/style.css', 'zen/template-parts/content-excerpt.php',
                  'zen/js/reading-count.js',
              }
              if names != expected:
                  missing = expected - names
                  extra = names - expected
                  msg = ''
                  if missing: msg += '缺失文件：' + ', '.join(sorted(missing))
                  if extra: msg += ('；' if msg else '') + '多余文件：' + ', '.join(sorted(extra))
                  raise SystemExit('发布包结构校验失败：' + msg)
              style = archive.read('zen/style.css').decode('utf-8')
              match = re.search(r'^Version:\s*(\S+)', style, re.MULTILINE)
              if not match or match.group(1) != version:
                  raise SystemExit('发布包版本校验失败')
              headers = {
                  'Theme Name': 'Zen',
                  'Requires at least': '6.5',
                  'Requires PHP': '8.0',
                  'Text Domain': 'zen',
              }
              for key, value in headers.items():
                  matches = re.findall(r'^' + re.escape(key) + r':[ \t]*(.*)$', style, re.MULTILINE)
                  if matches != [value]:
                      raise SystemExit('发布包元数据校验失败：' + key)

          PY

          mv zen.zip "$RUNNER_TEMP/zen-tracked.zip"
          curl --fail --location --retry 2 \
            https://github.com/yahuisme/wordpress-zen/releases/download/v2.0.0/zen.zip \
            --output "$RUNNER_TEMP/zen-font-source.zip"
          python scripts/package-release.py "$RUNNER_TEMP/zen-tracked.zip" \
            "$RUNNER_TEMP/zen-font-source.zip" zen.zip

      - name: Upload package for manual Release
        uses: actions/upload-artifact@v4
        with:
          name: zen-release-package
          path: |
            zen.zip
            release-notes.md
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
