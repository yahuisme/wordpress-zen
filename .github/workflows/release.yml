name: Release Theme

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Package and publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="$(grep -m1 '^Version:' style.css | sed 's/^Version:[[:space:]]*//')"
          if [ -z "$VERSION" ]; then
            echo "::error::无法从 style.css 读取版本号"
            exit 1
          fi
          echo "Theme version: $VERSION"

          NOTES_FILE="release-notes.md"
          awk -v version="$VERSION" '
            $0 == "## " version { found=1; next }
            found && /^## / { exit }
            found { print }
          ' .github/CHANGELOG.md | sed '/^[[:space:]]*$/d' > "$NOTES_FILE"

          if [ ! -s "$NOTES_FILE" ]; then
            echo "::error::无法从 .github/CHANGELOG.md 读取版本 $VERSION 的更新内容"
            exit 1
          fi

          git archive --format=zip --prefix=zen/ HEAD -o zen.zip -- . ':(exclude).github'

          if gh release view "v$VERSION" >/dev/null 2>&1; then
            echo "Release v$VERSION 已存在，跳过。"
          else
            gh release create "v$VERSION" zen.zip \
              --title "Zen Theme v$VERSION" \
              --target main \
              --notes-file "$NOTES_FILE"
            echo "已发布 Zen Theme v$VERSION。"
          fi