name: Release Zen

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: zen-release-main
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Package and publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="$(grep -m1 '^Version:' style.css | sed 's/^Version:[[:space:]]*//')"
          if [ -z "$VERSION" ]; then
            echo "::error::无法从 style.css 读取版本号"
            exit 1
          fi
          echo "Theme version: $VERSION"

          NOTES_FILE="release-notes.md"
          awk -v version="$VERSION" '
            $0 == "## " version { found=1; next }
            found && /^## / { exit }
            found { print }
          ' CHANGELOG.md | sed '/^[[:space:]]*$/d' > "$NOTES_FILE"

          if [ ! -s "$NOTES_FILE" ]; then
            echo "::error::无法从 CHANGELOG.md 读取版本 $VERSION 的更新内容"
            exit 1
          fi

          {
            printf '更新内容\n\n'
            cat "$NOTES_FILE"
          } > "$NOTES_FILE.tmp"
          mv "$NOTES_FILE.tmp" "$NOTES_FILE"

          git archive --format=zip --prefix=zen/ HEAD -o zen.zip

          python - "$VERSION" <<'PY'
          import sys, zipfile, re
          version = sys.argv[1]
          with zipfile.ZipFile('zen.zip') as archive:
              names = {name for name in archive.namelist() if not name.endswith('/')}
              forbidden = {n for n in names if n.startswith('zen/tests/') or n.startswith('zen/.github/') or n == 'zen/AGENTS.md'}
              if forbidden:
                  raise SystemExit('发布包含开发文件：' + ', '.join(sorted(forbidden)))
              expected = {
                  'zen/404.php', 'zen/LICENSE', 'zen/README.md', 'zen/archive.php',
                  'zen/assets/css/github-dark.min.css', 'zen/assets/css/phosphor-icons.css', 'zen/assets/css/style.css',
                  'zen/assets/css/admin.css', 'zen/assets/css/reading.css', 'zen/assets/css/layout.css', 'zen/assets/js/admin.js',
                  'zen/assets/fonts/Phosphor.woff2', 'zen/assets/js/highlight.min.js',
                  'zen/licenses/Phosphor-MIT.txt',
                  'zen/comments.php', 'zen/footer.php', 'zen/functions.php',
                  'zen/header.php', 'zen/inc/comments.php', 'zen/inc/enqueue.php',
                  'zen/inc/options.php', 'zen/inc/schema.php', 'zen/inc/setup.php',
                  'zen/inc/template-tags.php', 'zen/index.php', 'zen/js/main.js',
                  'zen/page-archives.php', 'zen/page-links.php', 'zen/page.php',
                  'zen/screenshot.png', 'zen/search.php', 'zen/single.php',
                  'zen/style.css', 'zen/template-parts/content-excerpt.php',
              }
              if names != expected:
                  missing = expected - names
                  extra = names - expected
                  msg = ''
                  if missing: msg += '缺失文件：' + ', '.join(sorted(missing))
                  if extra: msg += ('；' if msg else '') + '多余文件：' + ', '.join(sorted(extra))
                  raise SystemExit('发布包结构校验失败：' + msg)
              style = archive.read('zen/style.css').decode('utf-8')
              match = re.search(r'^Version:\s*(\S+)', style, re.MULTILINE)
              if not match or match.group(1) != version:
                  raise SystemExit('发布包版本校验失败')
              headers = {
                  'Theme Name': 'Zen',
                  'Requires at least': '6.5',
                  'Requires PHP': '8.0',
                  'Text Domain': 'zen',
              }
              for key, value in headers.items():
                  matches = re.findall(r'^' + re.escape(key) + r':[ \t]*(.*)$', style, re.MULTILINE)
                  if matches != [value]:
                      raise SystemExit('发布包元数据校验失败：' + key)
              readme = archive.read('zen/README.md').decode('utf-8')
              if 'WordPress 6.5+、PHP 8.0+' not in readme:
                  raise SystemExit('发布包环境要求说明不一致')
          PY

          if gh release view "v$VERSION" >/dev/null 2>&1; then
            echo "::error::Release v$VERSION 已存在，拒绝静默跳过。"
            exit 1
          fi
          gh release create "v$VERSION" zen.zip \
            --title "Zen v$VERSION" \
            --target "${{ github.sha }}" \
            --notes-file "$NOTES_FILE"
          echo "已发布 Zen v$VERSION。"
