name: Release Theme

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Package and publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="$(grep -m1 '^Version:' style.css | sed 's/^Version:[[:space:]]*//')"
          if [ -z "$VERSION" ]; then
            echo "::error::无法从 style.css 读取版本号"
            exit 1
          fi
          echo "Theme version: $VERSION"

          NOTES_FILE="release-notes.md"
          awk -v version="$VERSION" '
            $0 == "## " version { found=1; next }
            found && /^## / { exit }
            found { print }
          ' .github/CHANGELOG.md | sed '/^[[:space:]]*$/d' > "$NOTES_FILE"

          if [ ! -s "$NOTES_FILE" ]; then
            echo "::error::无法从 .github/CHANGELOG.md 读取版本 $VERSION 的更新内容"
            exit 1
          fi

          {
            printf '更新内容\n\n'
            cat "$NOTES_FILE"
          } > "$NOTES_FILE.tmp"
          mv "$NOTES_FILE.tmp" "$NOTES_FILE"

          RELEASE_FILES=(
            404.php LICENSE README.md archive.php comments.php footer.php
            functions.php header.php index.php page-archives.php page-links.php
            page.php search.php single.php style.css
            inc/comments.php inc/enqueue.php inc/options.php inc/schema.php
            inc/setup.php inc/template-tags.php
            js/main.js
            assets/css/github-dark.min.css assets/css/style.css
            assets/js/highlight.min.js assets/js/phosphor-icons.js
            screenshot.png
            template-parts/content-excerpt.php
          )
          git archive --format=zip --prefix=zen/ HEAD -o zen.zip -- "${RELEASE_FILES[@]}"

          python - "$VERSION" <<'PY'
          import sys, zipfile, re
          version = sys.argv[1]
          with zipfile.ZipFile('zen.zip') as archive:
              names = {name for name in archive.namelist() if not name.endswith('/')}
              expected = {
                  'zen/404.php', 'zen/LICENSE', 'zen/README.md', 'zen/archive.php',
                  'zen/assets/css/github-dark.min.css', 'zen/assets/css/style.css',
                  'zen/assets/js/highlight.min.js', 'zen/assets/js/phosphor-icons.js',
                  'zen/comments.php', 'zen/footer.php', 'zen/functions.php',
                  'zen/header.php', 'zen/inc/comments.php', 'zen/inc/enqueue.php',
                  'zen/inc/options.php', 'zen/inc/schema.php', 'zen/inc/setup.php',
                  'zen/inc/template-tags.php', 'zen/index.php', 'zen/js/main.js',
                  'zen/page-archives.php', 'zen/page-links.php', 'zen/page.php',
                  'zen/screenshot.png', 'zen/search.php', 'zen/single.php',
                  'zen/style.css', 'zen/template-parts/content-excerpt.php',
              }
              if names != expected:
                  raise SystemExit('发布包结构校验失败')
              style = archive.read('zen/style.css').decode('utf-8')
              match = re.search(r'^Version:\s*(\S+)', style, re.MULTILINE)
              if not match or match.group(1) != version:
                  raise SystemExit('发布包版本校验失败')
          PY

          if gh release view "v$VERSION" >/dev/null 2>&1; then
            echo "Release v$VERSION 已存在，跳过发布。"
          else
            gh release create "v$VERSION" zen.zip \
              --title "Zen Theme v$VERSION" \
              --target "${{ github.sha }}" \
              --notes-file "$NOTES_FILE"
            echo "已发布 Zen Theme v$VERSION。"
          fi