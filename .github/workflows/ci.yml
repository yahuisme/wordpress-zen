name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  php-tests:
    name: PHP 回归
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php-version: ['8.0', '8.2', '8.3']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
          coverage: none
      - run: for f in tests/*.php; do php -l "$f"; done
      - run: |
          for f in tests/audit-closeout.php tests/php-regression.php tests/assets-regression.php tests/custom-code-regression.php tests/seo-regression.php tests/template-design-regression.php tests/design-assets-regression.php tests/admin-options.php; do
            php "$f"
          done

  node-tests:
    name: Node 回归
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm ci
      - run: npm run test:js

  python-tests:
    name: Python 回归
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python tests/package-regression.py

  native-tests:
    name: 原生 WordPress 回归
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: sqlite3, pdo_sqlite, mbstring, curl
          coverage: none
      - name: Prepare isolated WordPress
        run: bash tests/ci-native-setup.sh
      - name: Run native boundary regressions
        run: |
          export ZEN_TEST_ISOLATED=1
          php tests/native-regression.php "$RUNNER_TEMP/zen-native/wp-load.php"
          php tests/php-native-regression.php "$RUNNER_TEMP/zen-native/wp-load.php"
      - name: Run serialized browser regression
        run: |
          python -m pip install --disable-pip-version-check --quiet playwright==1.55.0
          python -m playwright install --with-deps chromium
          export ZEN_CHROMIUM="$(python -c 'from playwright.sync_api import sync_playwright; p=sync_playwright().start(); print(p.chromium.executable_path); p.stop()')"
          php -S 127.0.0.1:18765 -t "$RUNNER_TEMP/zen-native" > "$RUNNER_TEMP/zen-native/server.log" 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT
          for i in $(seq 1 30); do curl -fsS 'http://127.0.0.1:18765/?p='"$(jq -r .normal "$RUNNER_TEMP/zen-native/fixture.json")" >/dev/null && break || sleep 1; done
          python tests/browser-regression.py http://127.0.0.1:18765 "$RUNNER_TEMP/zen-native/fixture.json"
